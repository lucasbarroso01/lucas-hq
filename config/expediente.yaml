# Lucas HQ · expediente dos agentes (fonte única de horários, prazos e limites)
# Agentes leem via tools/expediente.py; a interface importa este arquivo no build.
fuso: America/Sao_Paulo

silencio:            # nenhum agente roda (exceto manutencao)
  inicio: "23:30"
  fim: "04:30"

limites:
  subagentes_simultaneos: 5      # em todo o escritório
  rodadas_por_time: 1
  tentativas_por_item: 2         # na 3ª falha: status error com motivo
  espera_upstream_min: 15        # depois disso: waiting_upstream e encerra
  intervalo_minimo_posts_h: 2    # mesma página
  higgsfield_geracoes_dia: 1
  higgsfield_refacoes_dia: 1
  aviso_antes_post_min: 15
  renders_simultaneos: 1        # render sem GPU: um vídeo por vez no notebook (os outros esperam a vez)

recuperacao:          # notebook fechado no horário: o turno roda assim que o Linux voltar
  ativa: true
  verificar_a_cada_min: 5   # o cron procura turnos perdidos com essa frequência (e ao ligar)
  max_horas: 16             # turno perdido há mais que isso não é recuperado (fica para o próximo ciclo)

paginas:
  Worldframe:
    cor: "#7B5CE0"
    posts: ["09:30", "14:00", "17:00", "20:00", "22:30"]   # grade da Publicação (social-mcp)
    publicacao: ["09:30", "14:00", "17:00", "20:00", "22:30"]  # tools/social/publicar.py agenda cada vídeo novo no próximo livre
    duracao_min_s: 61        # monetização no Facebook: vídeos com mais de 60 s
    duracao_max_s: 120       # entre 60 e 120 s
    gancho_min: 75           # nota mínima do gancho (hookscore da skill ig-reel)
    cenas_com_atores_min: 0.5  # fração mínima de cenas no diorama com pessoas/veículos animados
    drive_ao_terminar: true  # cada vídeo vai para o Drive assim que o render termina

turnos:
  # Worldframe
  - id: radar-worldframe
    agente: radar-worldframe
    time: radar
    pagina: Worldframe
    inicio: "04:30"
    prazo: "05:00"
    faz: Levanta até 8 temas, escolhe 5, grava no cérebro
    depende_de: null
  - id: roteiros-worldframe
    agente: roteirista-lead
    time: roteiros
    pagina: Worldframe
    inicio: "05:00"
    prazo: "05:45"
    faz: 5 roteiros (faceless-video-direction + ig-reel-scripts)
    depende_de: radar-worldframe
  - id: producao-worldframe
    agente: editor-lead
    time: producao-wf
    pagina: Worldframe
    inicio: "05:45"
    prazo: "08:45"
    faz: Gera os 5 vídeos em código (sub-agentes video-editor; 1 render por vez)
    depende_de: roteiros-worldframe
  - id: qa-worldframe
    agente: brand-checker
    time: qualidade
    pagina: Worldframe
    inicio: "08:45"
    prazo: "09:15"
    faz: QA dos 5 vídeos (nota ≥ 8 ou devolve)
    depende_de: producao-worldframe
  - id: social-worldframe
    agente: social-scheduler
    time: social
    pagina: Worldframe
    inicio: "09:15"
    prazo: "09:30"
    faz: Sobe no Drive, gera o relatório e lança os 5 posts na Agenda
    depende_de: qa-worldframe
  - id: aprovacao-worldframe
    agente: lucas
    pagina: Worldframe
    inicio: "09:30"
    prazo: "11:30"
    faz: Lucas aprova os vídeos no Drive
    humano: true
  # Acervo de virais: o Lucas solta vídeos em acervo/referencias/ durante a semana; o curador ficha no domingo
  - id: acervo-semanal
    agente: curador-acervo
    time: acervo
    dias: [dom]
    inicio: "10:00"
    prazo: "12:00"
    faz: Ficha os virais novos de acervo/referencias (prints dos frames, tema, copy, edição e animações) e atualiza brain/acervo.md
    depende_de: null
  # analytics-diario saiu da agenda (31/10, economia de cota): rode o agente analista só quando mandar as views
  - id: manutencao-cerebro
    agente: analista
    time: analytics
    dias: [dom]
    inicio: "23:00"
    prazo: "23:59"
    faz: Condensa o cérebro (junta repetidas, arquiva temas antigos)
    depende_de: null
    manutencao: true      # pode rodar no horário de silêncio

sob_demanda:
  agencia:
    agentes: [briefing, roteirista-b2b]
    janela: { inicio: "09:00", fim: "18:00" }
    clientes_por_vez: 1
    fila: fifo
